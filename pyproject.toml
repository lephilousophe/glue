[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "glue"
license = "BSD-3-Clause"
license-files = ["COPYING"]
authors = [
    { name = "Jorge Bastida", email = "me@jorgebastida.com" },
]
description = "Glue is a simple command line tool to generate sprites."
readme = "README.rst"
keywords = [ "glue", "sprites", "css", "cocos2d"]
requires-python = ">=3.8"
dependencies = [
    "Pillow>=9.0",
    "Jinja2>=3.1,<3.2",
]
classifiers=[
    "Development Status :: 4 - Beta",

    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Topic :: Utilities",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]

[project.optional-dependencies]
tests = [
    "pytest>=9.1,<9.2",
    "css-parser>=1.1,<2",
]

[project.urls]
repository = "http://github.com/jorgebastida/glue"

[project.scripts]
glue = "glue.bin:main"

[tool.setuptools]
packages = ["glue"]

[tool.setuptools.dynamic]
version = {attr = "glue.__version__"}
